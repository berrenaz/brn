<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hazelune Admin</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <span class="brand">Hazelune</span>
      <h1>Admin girişi</h1>
      <p class="sub">Menü fotoğrafı, açıklama ve fiyatları buradan yöneteceksin.</p>
      <p class="error" id="errorBox" hidden></p>
      <form id="loginForm">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="submitBtn" type="submit">Giriş yap</button>
      </form>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
