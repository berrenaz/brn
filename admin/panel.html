<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hazelune Admin Panel</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="panel-top">
        <span class="brand">Hazelune</span>
        <button class="ghost" id="logoutBtn" type="button">Çıkış</button>
      </div>
      <h1>Panel</h1>
      <p class="sub" id="adminEmail"></p>
      <p class="note">Giriş çalışıyor. Bir sonraki adımda buradan ürün fotoğrafı, açıklama ve fiyatı değiştireceksin.</p>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/panel-guard.js"></script>
</body>
</html>
