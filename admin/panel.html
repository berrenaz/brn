<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hazelune Admin Panel</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="is-panel">
  <header class="panel-bar">
    <span class="brand">Hazelune</span>
    <div class="panel-bar-right">
      <span id="adminEmail"></span>
      <button class="ghost" id="logoutBtn" type="button">Çıkış</button>
    </div>
  </header>

  <main class="panel-page">
    <h1>Menü</h1>
    <p class="lead">Fotoğraf, açıklama ve fiyatı buradan değiştir. Kaydet deyince sitede görünür.</p>

    <div class="banner" id="panelBanner" hidden></div>
    <button class="seed" id="seedBtn" type="button" hidden>Menüyü yükle</button>
    <nav class="tabs" id="panelTabs" aria-label="Kategoriler"></nav>
    <div id="panelList"><p class="note">Yükleniyor…</p></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="js/panel-guard.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
